# dest is string | string[] | {win32?, linux?, darwin?, default?} (values: string | string[])
# dest supports $HOME, $DOCUMENTS, %VAR%, ${VAR}, ~ — platforms: [win32, linux, darwin] still works as extra filter

links:
  - src: nvim
    dest:
      win32: "%LOCALAPPDATA%/nvim"
      default: "$HOME/.config/nvim"
  - src: wezterm
    dest: "$HOME/.config/wezterm"
  - src: powershell/Microsoft.PowerShell_profile.ps1
    dest:
      win32:
        - "$DOCUMENTS/WindowsPowerShell/Microsoft.PowerShell_profile.ps1"
        - "$DOCUMENTS/PowerShell/Microsoft.PowerShell_profile.ps1"
  - src: zellij
    dest:
      win32: "$APPDATA/Zellij/config"
  - src: lazygit/config.yml
    dest:
      win32: "$LOCALAPPDATA/lazygit/config.yml"
      linux: "~/.config/lazygit/config.yml"
