# Easy to edit — dest supports $HOME, $DOCUMENTS, %VAR%, ${VAR}, ~ platforms: [win32, linux, darwin] or omit for all

links:
  - src: nvim
    dest: "%LOCALAPPDATA%/nvim"
    platforms: [win32]
  - src: nvim
    dest: "$HOME/.config/nvim"
    platforms: [linux, darwin]
  - src: wezterm
    dest: "$HOME/.config/wezterm"
  - src: powershell/Microsoft.PowerShell_profile.ps1
    dest: "$DOCUMENTS/WindowsPowerShell/Microsoft.PowerShell_profile.ps1"
    platforms: [win32]
  - src: powershell/Microsoft.PowerShell_profile.ps1
    dest: "$DOCUMENTS/PowerShell/Microsoft.PowerShell_profile.ps1"
    platforms: [win32]
  - src: starship/starship-windows.toml
    dest: "$HOME/.config/starship.toml"
    platforms: [win32]
  - src: zellij
    dest: "$APPDATA/Zellij/config"
    platforms: [win32]
  - src: lazygit/config.yml
    dest: "$LOCALAPPDATA/lazygit/config.yml"
    platforms: [win32]
